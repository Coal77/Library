<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Library</title>
<link rel="stylesheet" href="library.css">
</head>
<body>
<header class="site-header">
    <h1>My Library</h1>
    <button type="button" id="new-book-btn">Add book</button>
</header>

<main>
    <!-- JS will fill this container with one .book-card per book.
    The cards below are static samples showing the structure to generate. -->
    <section class="library" id="library">

    <article class="book-card" data-id="sample-1">
        <h2 class="book-title">The Hobbit</h2>
        <p class="book-author">J.R.R. Tolkien</p>
        <p class="book-pages">295 pages</p>
        <label class="book-read">
            <input type="checkbox" checked>
        Read
        </label>
    </article>

    <article class="book-card" data-id="sample-2">
        <h2 class="book-title">The Pragmatic Programmer</h2>
        <p class="book-author">Andrew Hunt &amp; David Thomas</p>
        <p class="book-pages">352 pages</p>
        <label class="book-read">
            <input type="checkbox">
            Read
        </label>
    </article>

    <article class="book-card" data-id="sample-3">
        <h2 class="book-title">Things Fall Apart</h2>
        <p class="book-author">Chinua Achebe</p>
        <p class="book-pages">209 pages</p>
        <label class="book-read">
        <input type="checkbox" checked>
        Read
        </label>
    </article>

    </section>
</main>

<dialog id="book-dialog">
  <form id="book-form" method="dialog">
    <h2>Add a book</h2>

    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required>
    </div>

    <div class="field">
      <label for="author">Author</label>
      <input type="text" id="author" name="author" required>
    </div>

    <div class="field">
      <label for="pages">Pages</label>
      <input type="number" id="pages" name="pages" min="1" required>
    </div>

    <div class="field field-check">
      <input type="checkbox" id="read" name="read">
      <label for="read">I've read this book</label>
    </div>

    <div class="form-actions">
      <button type="submit" value="cancel" formnovalidate>Cancel</button>
      <button type="submit" id="confirm-btn" value="add">Add book</button>
    </div>
  </form>
</dialog>

    <script src="library.js" defer></script>
</body>
</html>
